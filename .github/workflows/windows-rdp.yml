
name: EnigMano Instance Deployment

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Create User Account
      run: |
        $Password = ConvertTo-SecureString "VanaRDP@2024!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin"
        
    - name: Download and Setup ngrok
      run: |
        Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
        Expand-Archive ngrok.zip -DestinationPath C:\ngrok
        
    - name: Configure ngrok
      run: |
        C:\ngrok\ngrok.exe config add-authtoken "${{ secrets.NGROK_SHAHZAIB }}"
        
    - name: Start ngrok Tunnel (Diagnostic)
      run: |
        Write-Host "Starting ngrok..."
        $proc = Start-Process -FilePath "C:\ngrok\ngrok.exe" -ArgumentList "tcp 3389" -RedirectStandardError "C:\ngrok_err.txt" -RedirectStandardOutput "C:\ngrok_out.txt" -WindowStyle Hidden -PassThru
        Start-Sleep -Seconds 10
        
        if ($proc.HasExited) {
            Write-Host "=== NGROK DIED IMMEDIATELY ===" -ForegroundColor Red
            Write-Host "Error log:" -ForegroundColor Yellow
            Get-Content C:\ngrok_err.txt
        } else {
            Write-Host "=== NGROK IS RUNNING ===" -ForegroundColor Green
        }
        
    - name: Get Connection Details
      run: |
        Write-Host "`n=== CONNECTION DETAILS ===" -ForegroundColor Green
        $maxRetries = 5
        $retryCount = 0
        $success = $false
        
        while ($retryCount -lt $maxRetries -and -not $success) {
            try {
                $ngrokApi = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
                $publicUrl = $ngrokApi.tunnels[0].public_url
                $hostAddr = $publicUrl -replace "tcp://", ""
                
                Write-Host "==================================================" -ForegroundColor Cyan
                Write-Host "RDP HOST: $hostAddr" -ForegroundColor White
                Write-Host "USERNAME: runneradmin" -ForegroundColor White
                Write-Host "PASSWORD: VanaRDP@2024!" -ForegroundColor White
                Write-Host "==================================================" -ForegroundColor Cyan
                $success = $true
            } catch {
                $retryCount++
                Write-Host "Waiting for ngrok API... (Attempt $retryCount/$maxRetries)" -ForegroundColor Yellow
                Start-Sleep -Seconds 5
            }
        }
        
        if (-not $success) {
            Write-Host "Error: Could not connect to ngrok API." -ForegroundColor Red
        }
        
    - name: Keep Session Alive
      run: |
        Write-Host "`n=== SESSION ACTIVE ===" -ForegroundColor Green
        while ($true) { Start-Sleep -Seconds 3600 }
