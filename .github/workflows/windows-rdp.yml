name: Free RDP
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable RDP and Set Password
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "P@ssw0rd123!"
          
      - name: Install ngrok via Chocolatey
        run: |
          choco install ngrok -y
          
      - name: Configure and Start Tunnel
        run: |
          ngrok config add-authtoken ${{ secrets.NGROK_SHAHZAIB }}
          Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389" -NoNewWindow
          Start-Sleep -Seconds 15
          $tunnel = Invoke-RestMethod http://localhost:4040/api/tunnels
          Write-Host "=================================================="
          Write-Host "RDP HOST: $($tunnel.tunnels[0].public_url -replace 'tcp://', '')"
          Write-Host "USERNAME: runneradmin"
          Write-Host "PASSWORD: P@ssw0rd123!"
          Write-Host "=================================================="
          
      - name: Keep Alive
        run: |
          while ($true) { Start-Sleep -Seconds 3600 }
