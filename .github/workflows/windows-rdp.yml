name: EnigMano Instance Deployment

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Create User Account
      run: |
        $Password = ConvertTo-SecureString "VanaRDP@2024!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin"
        
    - name: Download and Setup bore (Free Tunnel)
      run: |
        Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-pc-windows-msvc.zip" -OutFile "bore.zip"
        Expand-Archive bore.zip -DestinationPath C:\bore
        
    - name: Start bore Tunnel
      run: |
        Write-Host "Starting bore tunnel on port 3389..."
        $proc = Start-Process -FilePath "C:\bore\bore.exe" -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput "C:\bore_out.txt" -RedirectStandardError "C:\bore_err.txt" -WindowStyle Hidden -PassThru
        Start-Sleep -Seconds 10
        
        if ($proc.HasExited) {
            Write-Host "=== BORE DIED IMMEDIATELY ===" -ForegroundColor Red
            Get-Content C:\bore_err.txt
            Get-Content C:\bore_out.txt
        } else {
            Write-Host "=== BORE IS RUNNING ===" -ForegroundColor Green
        }
        
    - name: Get Connection Details
      run: |
        Write-Host "`n=== CONNECTION DETAILS ===" -ForegroundColor Green
        Start-Sleep -Seconds 5
        $output = Get-Content C:\bore_out.txt -Raw
        
        if ($output -match "listening at (bore\.pub:\d+)") {
            $hostAddr = $matches[1]
            Write-Host "==================================================" -ForegroundColor Cyan
            Write-Host "RDP HOST: $hostAddr" -ForegroundColor White
            Write-Host "USERNAME: runneradmin" -ForegroundColor White
            Write-Host "PASSWORD: VanaRDP@2024!" -ForegroundColor White
            Write-Host "==================================================" -ForegroundColor Cyan
        } else {
            Write-Host "Error: Could not find bore.pub address in output." -ForegroundColor Red
            Write-Host "--- STDOUT ---"
            Get-Content C:\bore_out.txt
            Write-Host "--- STDERR ---"
            Get-Content C:\bore_err.txt
        }
        
    - name: Keep Session Alive
      run: |
        Write-Host "`n=== SESSION ACTIVE ===" -ForegroundColor Green
        while ($true) { Start-Sleep -Seconds 3600 }
